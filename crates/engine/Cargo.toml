[package]
name = "kanaemi-engine"
description = "Conversion: dictionaries in, ranked candidates out"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
encoding_rs = "0.8.42"
fst = "0.4.7"
kanaemi-core.workspace = true
memmap2 = "0.9.11"
sha2 = "0.11.0"
thiserror = "2.0.21"
unicode-normalization = "0.1"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
criterion.workspace = true
kanaemi-bench-support.workspace = true
kanaemi-config.workspace = true
kanaemi-functions.workspace = true
proptest.workspace = true

[[bench]]
name = "loading"
harness = false

[[bench]]
name = "conversion"
harness = false
