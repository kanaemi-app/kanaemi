[package]
name = "kanaemi-ibus"
description = "The Linux input method, an IBus engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kanaemi-ibus"
path = "src/main.rs"

[dependencies]
kanaemi-core.workspace = true
# What IBus is told is built and tested on every platform.
kanaemi-linux.workspace = true
# The values IBus sends are built and tested on every platform.
zvariant = { version = "5", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
kanaemi-config.workspace = true
kanaemi-runtime.workspace = true
tracing = { version = "0.1", features = ["release_max_level_info"] }
serde = "1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
