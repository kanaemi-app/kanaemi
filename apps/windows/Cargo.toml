[package]
name = "kanaemi-windows"
description = "The Windows input method, a Text Services Framework COM DLL"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "kanaemi"
crate-type = ["cdylib", "rlib"]

[dependencies]
kanaemi-core.workspace = true

[target.'cfg(windows)'.dependencies]
kanaemi-config.workspace = true
kanaemi-engine.workspace = true
kanaemi-runtime.workspace = true
tracing = { version = "0.1", features = ["release_max_level_info"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_TextServices",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
