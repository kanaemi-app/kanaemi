# Tells Fcitx5 about the input method the add-on serves, as
# fcitx5/inputmethod/kanaemi.conf. install.sh and package.sh fill in the
# add-on's folder.
[InputMethod]
Name=Kanaemi
Icon=@LIBDIR@/kanaemi.svg
# Shown for the input method in a panel, whatever the mode: not あ or A,
# which would read as the input mode.
Label=K
LangCode=ja
Addon=kanaemi
Configurable=False
