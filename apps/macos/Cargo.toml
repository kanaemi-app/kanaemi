[package]
name = "kanaemi-macos"
description = "The macOS input method, an Input Method Kit app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kanaemi"
path = "src/main.rs"

[dependencies]
kanaemi-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
kanaemi-config.workspace = true
kanaemi-runtime.workspace = true
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSRange", "NSAttributedString", "NSDictionary", "NSValue", "NSGeometry", "NSBundle", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSResponder", "NSPanel", "NSWindow", "NSView", "NSTextField", "NSControl", "NSColor", "NSFont", "NSText", "NSGraphics", "NSAttributedString", "NSBox", "NSImage", "NSImageView", "NSMenu", "NSMenuItem", "NSRunningApplication", "objc2-core-graphics", "block2"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGSession"] }
objc2-input-method-kit = { version = "0.3", features = ["IMKServer", "IMKInputController", "IMKCandidates", "objc2-app-kit"] }
tracing = { version = "0.1", features = ["release_max_level_info"] }
