[package]
name = "kanaemi-settings"
description = "The settings app, launched from the input method's menu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
dioxus = { workspace = true, features = ["desktop"] }
futures-channel = "0.3.34"
kanaemi-config.workspace = true
kanaemi-core.workspace = true
kanaemi-engine.workspace = true
kanaemi-functions.workspace = true
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tree-sitter-highlight = "0.27.0"
tree-sitter-luau = "1.2.0"
unicode-normalization = "0.1"
ureq = "3.4.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

# Applications are listed and drawn by AppKit to pick them by their icons.
[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSGraphicsContext", "NSImage", "NSImageRep", "NSRunningApplication", "NSWorkspace", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSData", "NSDictionary", "NSGeometry", "NSString", "NSURL"] }

[dev-dependencies]
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

# The icon Windows shows for the program is drawn from the logo as it builds.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.11"
ico = "0.5.0"
resvg = { version = "0.48.1", default-features = false }
