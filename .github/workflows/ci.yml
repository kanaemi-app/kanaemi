# This workflow is managed by gh actions-lock.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # Each OS checks the code behind its own cfg, which the others skip.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.1
        if: runner.os != 'Windows'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The same tools as local development (flake.nix), kept for the steps below.
      - uses: nicknovitski/nix-develop@v1.2.1
        if: runner.os != 'Windows'
      # Nix does not run on Windows: rustup reads rust-toolchain.toml, and
      # just runs the recipes with the runner's Git Bash.
      - run: choco install just --no-progress -y
        if: runner.os == 'Windows'
      # The same gate as local development (justfile).
      - run: just ci
        env:
          CI: "1"
