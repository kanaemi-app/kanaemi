# This workflow is managed by gh actions-lock.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request only needs its latest commit checked. A run on main waits
# for the one before it instead of cancelling it, so each one finishes and
# saves the caches that pull requests start from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # Each OS checks the code behind its own cfg, which the others skip.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.1
        if: runner.os != 'Windows'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The store the development shell comes from, as the files that pin it
      # describe it. Only an exact match is restored, so the store never
      # carries what an older pin left behind, and only main saves, as for
      # Rust below.
      - uses: nix-community/cache-nix-action@v7.0.2
        if: runner.os != 'Windows'
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
          save: ${{ github.ref == 'refs/heads/main' }}
      # The same tools as local development (flake.nix), kept for the steps below.
      - uses: nicknovitski/nix-develop@v1.2.1
        if: runner.os != 'Windows'
      # Nix does not run on Windows: rustup reads rust-toolchain.toml, and
      # just runs the recipes with the runner's Git Bash.
      - run: choco install just --no-progress -y
        if: runner.os == 'Windows'
      # Keyed by what picks the C and C++ compilers too, since cc does not
      # rebuild their objects (Luau) when those change: flake.lock pins the
      # development shell's, and the runner image provides Windows'. rust-cache
      # itself adds rustc's version and the CC*, CXX* and CFLAGS* variables,
      # so it comes after the development shell. Only main saves, so pull
      # requests cannot evict the caches each other start from.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ hashFiles('flake.lock') }}
          env-vars: ${{ runner.os == 'Windows' && 'ImageOS ImageVersion' || '' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The same gate as local development (justfile).
      - run: just ci
        env:
          CI: "1"
