# This workflow is managed by gh actions-lock.

name: Release

# A v tag makes the installers for each OS and attaches them to a draft
# release of that tag, to be read over and published by hand.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release, so the packages ask for libraries no
        # newer than it has.
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # The version is described from the tags.
          fetch-depth: 0
      # Built outside Nix, whose binaries load libraries from /nix/store.
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config dpkg-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libxdo-dev libssl-dev
      - run: rustup toolchain install
      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm
      - run: apps/ibus/package.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-${{ matrix.os }}
          path: |
            target/package/*.deb
            target/package/*.rpm

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: brew install librsvg
      - run: rustup toolchain install
      - run: apps/macos/package.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos
          path: target/package/*.pkg

  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install
      - run: dotnet tool install --global wix --version 5.0.2
      - run: apps/windows/package.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-${{ matrix.os }}
          path: target/package/*.msi

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: packages
          merge-multiple: true
      - run: gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
