# This workflow is managed by gh actions-lock.

name: Release

# Publishing a release makes the installers for each OS from its tag and
# attaches them to it.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml

  upload:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: packages
          pattern: package-*
          merge-multiple: true
      # --clobber lets a rerun replace what an earlier attempt attached.
      - run: gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
