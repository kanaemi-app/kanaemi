# This workflow is managed by gh actions-lock.

name: Package

# Makes the installers for each OS from the checked-out commit and keeps them,
# each with a description of it (FILE.json), as workflow artifacts named
# package-*, for the caller to use or discard.
#
# Run on its own, it proves the installers still build: on every commit to
# main, and on a pull request only when it touches what the installers depend
# on beyond the Rust sources. Those sources are compiled on every OS by
# ci.yml, and nothing in them depends on the CPU architecture; the
# architectures only these jobs build (ARM64, and x86 on Windows) differ by
# the dependencies, their features and the build scripts.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - apps/**
      - crates/*/Cargo.toml
      - crates/*/build.rs
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - .github/**
  workflow_call:
    inputs:
      # Signs the macOS app by the release identity, kept in the secrets of
      # the environment "release"; ad-hoc otherwise. Every release is signed
      # by the same one, so an update keeps the permissions users gave it.
      sign:
        type: boolean
        default: false

# As in ci.yml: a pull request only needs its latest commit packaged, and runs
# on main queue. A release is never cancelled. Called by a workflow, this
# reads the caller's event and ref.
concurrency:
  group: package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release, so the packages ask for libraries no
        # newer than it has.
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # The version is described from the tags.
          fetch-depth: 0
      # Built outside Nix, whose binaries load libraries from /nix/store.
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config dpkg-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libxdo-dev libssl-dev libfcitx5core-dev
      - run: rustup toolchain install
      # The C and C++ objects (Luau) are built by the runner image's compilers,
      # which cc does not rebuild them for when they change, so the image's
      # version keys the cache. Only main saves, so pull requests cannot evict
      # the caches each other start from. A release builds from nothing, so
      # what it ships owes nothing to an earlier run.
      - uses: Swatinem/rust-cache@v2.9.2
        if: ${{ !inputs.sign }}
        with:
          env-vars: ImageOS ImageVersion
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm
      - run: apps/ibus/package.sh
      - run: apps/fcitx5/package.sh
      - run: .github/describe-packages.sh linux
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: package-linux-${{ matrix.os }}
          path: |
            target/package/*.deb
            target/package/*.rpm
            target/package/*.json
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    environment: ${{ inputs.sign && 'release' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: brew install librsvg
      - run: rustup toolchain install
      # As for Linux.
      - uses: Swatinem/rust-cache@v2.9.2
        if: ${{ !inputs.sign }}
        with:
          env-vars: ImageOS ImageVersion
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Import the release signing identity
        if: inputs.sign
        run: |
          .github/import-macos-identity.sh "$RUNNER_TEMP/signing.keychain-db"
          echo "KANAEMI_SIGN_IDENTITY=Kanaemi Release" >>"$GITHUB_ENV"
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
      - run: apps/macos/package.sh
      - run: .github/describe-packages.sh macos
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: package-macos
          path: |
            target/package/*.pkg
            target/package/*.zip
            target/package/*.json
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install
      # As for Linux.
      - uses: Swatinem/rust-cache@v2.9.2
        if: ${{ !inputs.sign }}
        with:
          env-vars: ImageOS ImageVersion
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: dotnet tool install --global wix --version 5.0.2
      - run: apps/windows/package.ps1
        shell: pwsh
      - run: .github/describe-packages.sh windows
        shell: bash
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: package-windows-${{ matrix.os }}
          path: |
            target/package/*.msi
            target/package/*.json
          if-no-files-found: error
