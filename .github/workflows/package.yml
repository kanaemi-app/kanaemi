# This workflow is managed by gh actions-lock.

name: Package

# Makes the installers for each OS from the checked-out commit and keeps them,
# each with a description of it (FILE.json), as workflow artifacts named
# package-*, for the caller to use or discard.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release, so the packages ask for libraries no
        # newer than it has.
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # The version is described from the tags.
          fetch-depth: 0
      # Built outside Nix, whose binaries load libraries from /nix/store.
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config dpkg-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libxdo-dev libssl-dev
      - run: rustup toolchain install
      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm
      - run: apps/ibus/package.sh
      - run: .github/describe-packages.sh linux
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: package-linux-${{ matrix.os }}
          path: |
            target/package/*.deb
            target/package/*.rpm
            target/package/*.json
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: brew install librsvg
      - run: rustup toolchain install
      - run: apps/macos/package.sh
      - run: .github/describe-packages.sh macos
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: package-macos
          path: |
            target/package/*.pkg
            target/package/*.json
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install
      - run: dotnet tool install --global wix --version 5.0.2
      - run: apps/windows/package.ps1
        shell: pwsh
      - run: .github/describe-packages.sh windows
        shell: bash
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: package-windows-${{ matrix.os }}
          path: |
            target/package/*.msi
            target/package/*.json
          if-no-files-found: error
