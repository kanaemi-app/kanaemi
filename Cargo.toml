[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kanaemi-app/kanaemi"

[workspace.dependencies]
kanaemi-bench-support = { path = "crates/bench-support" }
kanaemi-config = { path = "crates/config" }
kanaemi-core = { path = "crates/core" }
kanaemi-engine = { path = "crates/engine" }
kanaemi-functions = { path = "crates/functions" }
kanaemi-runtime = { path = "crates/runtime" }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
dioxus = "0.7.10"
proptest = { version = "1.11", default-features = false, features = ["std"] }
