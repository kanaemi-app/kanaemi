[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kanaemi-app/kanaemi"

[workspace.dependencies]
kanaemi-config = { path = "crates/config" }
kanaemi-core = { path = "crates/core" }
kanaemi-engine = { path = "crates/engine" }
dioxus = "0.7.10"
